*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:0 16px 96px}
.top{display:flex;align-items:center;gap:12px;padding:16px 0}
.logo{flex:none;width:52px;height:52px;border-radius:14px;background:var(--brand);color:var(--on);display:grid;place-items:center;font:700 1.6rem var(--serif)}
.top h1{margin:0;font-size:1.45rem;line-height:1.15}
.top p{margin:0;color:var(--muted);font-size:.9rem}
.hero{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-radius:20px;padding:22px}
.hero small{opacity:.85}

.hero p{margin:0 0 18px;opacity:.92}
.hero button{background:#fff;color:#4A2070;border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px}
.card h2{margin:0 0 4px;font-size:1.3rem}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.hd h2{margin:0}
.link{background:none;border:0;color:var(--brand);font-weight:700;cursor:pointer;padding:4px}
.chip{background:var(--soft);color:var(--brand);border-radius:8px;padding:4px 10px;font-size:.85rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.stat{background:var(--soft);border-radius:14px;padding:14px 6px;text-align:center}
.stat b{display:block;font-size:2rem;line-height:1.1}
.stat span{color:var(--muted);font-size:.9rem}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.out{background:none;border:1.5px solid var(--line);color:var(--brand);border-radius:12px;padding:11px 10px;font-weight:700;cursor:pointer}
.full{width:100%;margin-top:12px}
.fill{background:var(--brand);color:var(--on);border:1.5px solid var(--brand);border-radius:12px;padding:12px;font-weight:700;cursor:pointer}
.out.on{color:var(--ok);border-color:var(--ok)}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row>div:nth-child(2){flex:1;min-width:0}
.row h3{margin:0;font-size:1.05rem}
.row p{margin:0;color:var(--muted);font-size:.9rem}
.av{flex:none;width:48px;height:48px;border-radius:50%;background:var(--soft);color:var(--brand);display:grid;place-items:center;font-weight:700}
.date{flex:none;width:64px;text-align:center;background:var(--soft);color:var(--brand);border-radius:14px;padding:8px 0;font-weight:700}
.date small{display:block;font-size:.8rem}
.date b{font-size:1.7rem;line-height:1}
.tag{display:inline-block;margin-top:4px;background:var(--soft);color:var(--brand);border-radius:6px;padding:2px 10px;font-size:.85rem}
input,textarea{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px}
.bar{display:flex;gap:8px;margin-top:10px}
.near{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.near select{width:auto;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 10px;font:inherit}.near span{color:var(--muted);font-size:.9rem}
.hub{display:grid;gap:12px}.hubc{text-align:left;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--brand);border-radius:18px;padding:18px;cursor:pointer;display:grid;gap:4px}.hubc b{font-size:1.25rem}.hubc span{color:var(--muted)}
.seg{display:flex;gap:6px;margin:10px 0}.fl{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}.seg button,.fl button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer}.seg button[aria-pressed=true],.fl button[aria-pressed=true]{background:var(--brand);color:var(--on);border-color:var(--brand)}
.rec{border-top:1px solid var(--line);padding:12px 0}.rec:first-of-type{border-top:0}.rec summary{cursor:pointer;font-weight:700}.rec p,.rec ol{color:var(--muted);margin:6px 0 0}.rec ol{padding-left:20px}
.f{display:grid;gap:10px;margin-top:10px}
.empty{color:var(--muted);text-align:center;padding:20px 8px}
.bub{max-width:80%;margin:6px 0 6px auto;background:var(--brand);color:var(--on);padding:8px 12px;border-radius:14px 14px 4px 14px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs div{display:flex;width:100%;max-width:560px}
.tabs button{flex:1;background:none;border:0;color:var(--muted);padding:6px 0;cursor:pointer;display:grid;gap:2px;justify-items:center;font-size:.75rem}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current=page]{color:var(--brand);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;opacity:0;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>

function tr1(k){if(Object.prototype.hasOwnProperty.call(ZH,k))return ZH[k];

var m;
if(m=k.match(/^Class of (\d+)$/))return m[1]+"届";

if(m=k.match(/^(.+), Class of (\d+)$/))return tr1(m[1])+"，"+m[2]+"届";
if(m=k.match(/^Serves (\d+)$/))return m[1]+"人份";
if(m=k.match(/^Makes about (\d+)$/))return"约"+m[1]+"个";
if(m=k.match(/^Makes (\d+)$/))return m[1]+"个";

if(m=k.match(/^(\d+) hour$/))return m[1]+"小时";
if(m=k.match(/^(\d+)h ago$/))return m[1]+"小时前";
if(m=k.match(/^(Alumni discounts|Interest groups|Alumni|Events|Career) in (.+)$/))return tr1(m[2])+"的"+tr1(m[1]);
if(m=k.match(/^No alumni in (.+) yet\. Showing everyone\.$/))return tr1(m[1])+"暂无校友，已显示全部校友。";
if(m=k.match(/^No events in (.+) yet\. Choose All cities to see everything\.$/))return tr1(m[1])+"暂无活动。选择“所有城市”查看全部。";
if(m=k.match(/^No offers in (.+) yet\. Choose All cities to see everything\.$/))return tr1(m[1])+"暂无优惠。选择“所有城市”查看全部。";
if(m=k.match(/^(\d+) members$/))return m[1]+"位成员";
if(m=k.match(/^No groups in (.+) yet\. Choose All cities to see everything\.$/))return tr1(m[1])+"暂无小组。选择“所有城市”查看全部。";

return k}
